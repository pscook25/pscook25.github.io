<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CookiesWiki</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #3fb950;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f8fa;
        --card: #ffffff;
        --border: #d0d7de;
        --text: #1f2328;
        --muted: #656d76;
        --accent: #1a7f37;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 16px;
    }
    h1 { margin: 0 0 4px; font-size: 2rem; }
    .tagline { color: var(--muted); margin: 0 0 32px; }
    .grid { display: grid; gap: 16px; }
    a.card {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, transform 0.15s;
    }
    a.card:hover { border-color: var(--accent); transform: translateY(-2px); }
    a.card h2 { margin: 0 0 6px; font-size: 1.15rem; color: var(--accent); }
    a.card p { margin: 0; color: var(--muted); font-size: 0.95rem; }
    footer { margin-top: 40px; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <main>
    <h1>CookiesWiki</h1>
    <p class="tagline">Body recomp tools and recipes.</p>

    <div class="grid">
      <a class="card" href="body-recomp-macro-calculator.html">
        <h2>Body Recomp Macro Calculator</h2>
        <p>Work out calorie and macro targets for a recomp.</p>
      </a>

      <a class="card" href="recomp-meal-planner.html">
        <h2>Recomp Meal Planner</h2>
        <p>Plan your meals around your daily macro targets.</p>
      </a>

      <a class="card" href="recipes/">
        <h2>Recipes</h2>
        <p>Browse, search and sort all recipes with their macros.</p>
      </a>
    </div>

    <footer>Hosted on GitHub Pages.</footer>
  </main>
</body>
</html>
